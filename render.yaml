services:
  - type: web
    name: bipolar-voice-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: WEBHOOK_PATH
        value: /webhook
      - key: LOG_LEVEL
        value: INFO
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TRANSCRIPTION_PROVIDER
        value: yandex
      - key: LLM_PROVIDER
        value: yandex
      - key: YANDEX_CLOUD_FOLDER
        sync: false
      - key: YANDEX_CLOUD_API_KEY
        sync: false
      - key: YANDEX_CLOUD_MODEL
        value: gpt-oss-120b/latest
      - key: YANDEX_SPEECH_MODEL
        value: speech-realtime-250923/latest
      - key: YANDEX_CLOUD_BASE_URL
        value: https://ai.api.cloud.yandex.net/v1
      - key: YANDEX_REALTIME_WSS_URL
        value: wss://llm.api.cloud.yandex.net/v1/realtime
      - key: YANDEX_SPEECH_INPUT_RATE
        value: 44100
      - key: YANDEX_SPEECH_LANGUAGE
        value: ru-RU
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_WORKSHEET_NAME
        value: entries
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
