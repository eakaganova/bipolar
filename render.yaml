services:
  - type: web
    name: bipolar-voice-bot
    runtime: python
    plan: starter
    buildCommand: python -m pip install --upgrade pip setuptools wheel && pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: WEBHOOK_PATH
        value: /webhook
      - key: LOG_LEVEL
        value: INFO
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: LLM_PROVIDER
        value: yandex
      - key: YANDEX_CLOUD_FOLDER
        sync: false
      - key: YANDEX_CLOUD_API_KEY
        sync: false
      - key: YANDEX_CLOUD_MODEL
        value: gpt-oss-120b/latest
      - key: YANDEX_CLOUD_BASE_URL
        value: https://ai.api.cloud.yandex.net/v1
      - key: PUBLIC_BASE_URL
        sync: false
      - key: STORAGE_PROVIDER
        value: github_csv
      - key: GITHUB_REPO
        value: eakaganova/bipolar
      - key: GITHUB_BRANCH
        value: data
      - key: GITHUB_CSV_PATH
        value: data/entries.csv
      - key: GITHUB_TOKEN
        sync: false
